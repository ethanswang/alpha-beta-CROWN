[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abcrown"
version = "0.7.0"
description = "alpha-beta-CROWN: An Efficient, Scalable and GPU Accelerated Neural Network Verifier (winner of VNN-COMP 2021, 2022, 2023, 2024, 2025)"
readme = "README_abcrown.md"
requires-python = "~=3.11.0"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "α,β-CROWN Team", email = "huan@huan-zhang.com" },
    { name = "α,β-CROWN Team", email = "xiangru4@illinois.edu" },
]
keywords = [
    "neural-network-verification",
    "formal-verification",
    "alpha-beta-crown",
    "crown",
    "bound-propagation",
    "branch-and-bound",
    "robustness",
    "pytorch",
    "onnx",
]
dependencies = [
    # --- auto_LiRPA ---
    "torch==2.11.0",
    "torchvision>=0.21.0",
    "numpy>=2.0.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
    "graphviz>=0.21",
    "appdirs>=1.4.4",
    "setuptools",
    # --- abcrown ---
    "gurobipy<13.0.0",
    "onnx>=1.20.1",
    "onnx2pytorch @ git+https://github.com/Verified-Intelligence/onnx2pytorch@0826948e0d50cd09d909b7f26b2ee9ca2d3d71b3",
    "onnxoptimizer>=0.4.2",
    "onnxruntime>=1.24.1",
    "onnxscript>=0.7.0",
    "onnxsim>=0.4.36",  # CLI tool invoked, not imported
    "pandas>=3.0.0",
    "pillow>=10.0.0",
    "psutil>=7.2.2",
    "skl2onnx>=1.20.0",
    "sortedcontainers>=2.4.0",
    "sympy>=1.14.0",
    "termcolor>=3.3.0",
    # --- dev / test ---
    "pylint>=2.3.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14",
    "pytest-order>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Verified-Intelligence/alpha-beta-CROWN"
Repository = "https://github.com/Verified-Intelligence/alpha-beta-CROWN"
Documentation = "https://github.com/Verified-Intelligence/alpha-beta-CROWN/blob/main/complete_verifier/docs/abcrown_api.md"

[tool.setuptools.packages.find]
include = ["abcrown", "auto_LiRPA*", "complete_verifier*"]
exclude = ["complete_verifier.auto_LiRPA*"]

